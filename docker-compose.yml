services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hcm_lite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hcm} -d ${POSTGRES_DB:-hcm_lite}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    # Wait for Postgres to accept connections; the API creates its tables on startup.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hcm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hcm_lite}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-5}
      FRONTEND_ORIGIN: ${PUBLIC_URL:-http://localhost}
      PORT: 8000
    # Not published to the host: only Caddy reaches it, over the compose network.
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Keeps the Let's Encrypt certificates across restarts — without this you
      # re-request certificates every deploy and can hit rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
